# Site settings ---------------------------------------------------------------
locale       : "en-US"
title        : "Lucas Robinet"
name         : "Lucas Robinet"
description  : "PhD student working on multimodal deep learning for oncology. Trying to understand cancer, one dot product at a time."
url          : https://lucas-rbnt.github.io
baseurl      : ""
repository   : "lucas-rbnt/lucas-rbnt.github.io"

# Author / socials -------------------------------------------------------------
# Leave a field empty to hide its icon.
author:
  name          : "Lucas Robinet"
  avatar        : "avatar.png"
  bio           : "Trying to understand cancer, one dot product at a time 🦀"
  location      : "Toulouse"
  employer      : "Oncopole Claudius Regaud"
  email         : "lucas.robinet.gm@gmail.com"
  googlescholar : "https://scholar.google.com/citations?user=QmzP7VoAAAAJ&hl=en"
  github        : "Lucas-rbnt"
  linkedin      : "lucas-robinet-94ba45184/"
  twitter       : "LTenib"
  goodreads     : "user/show/188040309-lucas-robinet"

# Typed lines in the hero terminal (cycled in order).
taglines:
  - "multimodal deep learning × oncology"
  - "radiology + histopathology + omics → z"
  - "self-supervised, mostly"
  - "MONAI contributor"
  - "1. d4 enjoyer (no London system)"

# Reading files ----------------------------------------------------------------
include:
  - _pages
  - files
exclude:
  - .bundle
  - .devcontainer
  - .sass-cache
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor
  - avatar.jpg
  - avatar.png

# Conversion -------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

# Collections ------------------------------------------------------------------
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: teaching }
    values: { layout: page }
  - scope: { path: "", type: publications }
    values: { layout: page }

permalink: /:categories/:title/
timezone: Europe/Paris
future: true

# Plugins ----------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
