{%- comment -%}
  Disentangled multimodal representation.
  Three modalities -> encoder -> shared + modality-specific latents.
  Omics periodically goes missing and its specific code gets imputed.
{%- endcomment -%}
<figure class="fig fig--disentangle" aria-hidden="true">
  <svg viewBox="0 0 240 150" role="img">
    <defs>
      <linearGradient id="g-shared" x1="0" x2="1">
        <stop offset="0" style="stop-color:var(--rad)"/>
        <stop offset=".5" style="stop-color:var(--his)"/>
        <stop offset="1" style="stop-color:var(--omi)"/>
      </linearGradient>
    </defs>

    <!-- inputs -->
    <g class="d-in d-in--rad">
      <circle cx="24" cy="32" r="11" class="s-rad"/>
      <circle cx="24" cy="32" r="5" class="f-rad"/>
    </g>
    <g class="d-in d-in--his">
      <circle cx="19" cy="72" r="4.5" class="f-his"/>
      <circle cx="29" cy="70" r="3.5" class="f-his" opacity=".7"/>
      <circle cx="25" cy="80" r="4" class="f-his" opacity=".85"/>
    </g>
    <g class="d-in d-in--omi">
      <rect x="14" y="110" width="3.5" height="16" rx="1" class="f-omi"/>
      <rect x="20" y="114" width="3.5" height="12" rx="1" class="f-omi"/>
      <rect x="26" y="106" width="3.5" height="20" rx="1" class="f-omi"/>
      <rect x="32" y="116" width="3.5" height="10" rx="1" class="f-omi"/>
    </g>

    <!-- flows into encoder -->
    <path class="flow s-rad" d="M40 32 C70 32 78 62 100 66"/>
    <path class="flow s-his" d="M40 75 L100 75"/>
    <path class="flow s-omi flow--omi" d="M40 118 C70 118 78 88 100 84"/>

    <!-- encoder -->
    <path class="enc" d="M100 44 L134 60 L134 90 L100 106 Z"/>
    <text x="117" y="78" class="fig-txt" text-anchor="middle">f(·)</text>

    <!-- flows out -->
    <path class="flow s-ink" d="M134 70 C142 70 142 34 152 34"/>
    <path class="flow s-ink" d="M134 80 C142 80 142 100 152 100"/>

    <!-- latents -->
    <text x="152" y="22" class="fig-txt">z_shared</text>
    <rect x="152" y="27" width="72" height="12" rx="3" fill="url(#g-shared)" class="bar"/>

    <text x="152" y="62" class="fig-txt">z_specific</text>
    <rect x="152" y="68" width="52" height="8" rx="2.5" class="bar f-rad" style="--d:.3s"/>
    <rect x="152" y="81" width="64" height="8" rx="2.5" class="bar f-his" style="--d:.6s"/>
    <rect x="152" y="94" width="44" height="8" rx="2.5" class="bar bar--omi f-omi" style="--d:.9s"/>
    <rect x="152.5" y="94.5" width="43" height="7" rx="2.5" class="bar-ghost s-omi"/>
    <text x="200" y="101" class="fig-txt fig-txt--imp">imputed</text>

    <text x="24" y="146" class="fig-txt fig-txt--miss" text-anchor="middle">missing</text>
  </svg>
</figure>
